<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админ нэвтрэх · Санал хураалт</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
    </script>
    <link href="https://rsms.me/inter/inter.css" rel="stylesheet" />
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 font-sans flex items-center justify-center p-4 relative overflow-hidden">
    <div class="pointer-events-none absolute inset-0">
      <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] rounded-full bg-violet-600/20 blur-[120px]"></div>
      <div class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] rounded-full bg-fuchsia-600/15 blur-[100px]"></div>
    </div>

    <div class="relative w-full max-w-md rounded-3xl bg-white/5 border border-white/10 shadow-2xl backdrop-blur-xl p-10">
      <div class="text-center text-5xl mb-4">🔐</div>
      <h1 class="text-3xl font-bold text-center bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent mb-2">
        Админ нэвтрэх
      </h1>
      <p class="text-center text-slate-400 mb-8">Санал хураалтын систем</p>

      <div id="errorMessage" class="hidden mb-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/40 text-rose-300 text-center text-sm"></div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label for="password" class="block mb-2 text-sm font-semibold text-slate-400">Админ нууц үг</label>
          <input
            id="password"
            type="password"
            required
            autofocus
            placeholder="Нууц үгээ оруулна уу"
            class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-violet-500 focus:bg-white/10 transition"
          />
        </div>
        <button
          type="submit"
          id="loginBtn"
          class="w-full px-4 py-3 rounded-xl bg-gradient-to-r from-violet-500 to-fuchsia-500 font-semibold text-white hover:shadow-lg hover:shadow-violet-500/40 hover:-translate-y-0.5 transition disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0"
        >
          Хяналтын самбарт нэвтрэх
        </button>
      </form>
    </div>

    <script>
      const API_URL = "https://clapcomedyclub.mn/artist/api";

      const showError = (msg) => {
        const el = document.getElementById("errorMessage");
        el.textContent = msg;
        el.classList.remove("hidden");
        setTimeout(() => el.classList.add("hidden"), 5000);
      };

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = document.getElementById("password").value;
        const btn = document.getElementById("loginBtn");
        btn.disabled = true;
        btn.textContent = "Нэвтэрж байна...";
        try {
          const res = await fetch(`${API_URL}/admin/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password }),
          });
          const data = await res.json();
          if (res.ok) {
            localStorage.setItem("adminToken", data.token);
            window.location.href = "admin-panel.html";
          } else {
            showError(data.message || "Буруу нууц үг");
            btn.disabled = false;
            btn.textContent = "Хяналтын самбарт нэвтрэх";
            document.getElementById("password").value = "";
          }
        } catch (err) {
          console.error(err);
          showError("Нэвтрэхэд алдаа гарлаа. Дахин оролдоно уу.");
          btn.disabled = false;
          btn.textContent = "Хяналтын самбарт нэвтрэх";
        }
      });

      const token = localStorage.getItem("adminToken");
      if (token) {
        fetch(`${API_URL}/admin/verify`, { headers: { Authorization: `Bearer ${token}` } })
          .then((r) => { if (r.ok) window.location.href = "admin-panel.html"; });
      }
    </script>
  </body>
</html>
