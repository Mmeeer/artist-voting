<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Санал хураалтын үр дүн</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
    </script>
    <link href="https://rsms.me/inter/inter.css" rel="stylesheet" />
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased relative overflow-x-hidden">
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10">
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[500px] rounded-full bg-violet-600/15 blur-[140px]"></div>
      <div class="absolute bottom-0 right-0 w-[500px] h-[500px] rounded-full bg-fuchsia-600/10 blur-[120px]"></div>
    </div>

    <main class="mx-auto max-w-6xl px-4 py-10 sm:py-16">
      <header class="mb-12 text-center">
        <h1 class="bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-4xl font-bold tracking-tight text-transparent sm:text-5xl">
          🎉 Санал хураалтын үр дүн
        </h1>
        <p class="mt-3 text-lg text-slate-400">Шууд үр дүн</p>
      </header>

      <div id="loading" class="py-20 text-center">
        <div class="mx-auto h-12 w-12 animate-spin rounded-full border-4 border-white/10 border-l-violet-500"></div>
        <p class="mt-5 text-lg text-slate-400">Үр дүн ачааллаж байна…</p>
      </div>

      <div id="content" class="hidden">
        <div id="noResults" class="hidden py-20 text-center">
          <h2 class="mb-4 text-3xl font-bold text-violet-400">Үр дүн байхгүй</h2>
          <p class="text-lg text-slate-400">Энэ санал хураалтын үр дүн одоогоор байхгүй байна.</p>
        </div>

        <div id="resultsActive" class="hidden">
          <section class="mb-8 rounded-2xl border-l-4 border-violet-500 bg-white/5 p-6 backdrop-blur-sm">
            <h2 id="eventTitle" class="text-2xl font-bold text-violet-400"></h2>
            <div class="mt-3 flex flex-wrap items-center gap-4 text-sm text-slate-400">
              <div id="companyNameContainer" class="hidden">🏢 <span id="companyName" class="font-medium text-slate-300"></span></div>
              <div id="viewModeContainer" class="hidden">
                <span id="viewModeBadge" class="inline-flex items-center rounded-full border-2 px-4 py-1.5 text-sm font-bold"></span>
              </div>
              <div class="rounded-full bg-white/10 px-3 py-1">📊 <span id="totalVotes">0</span> нийт санал</div>
              <div class="inline-flex items-center rounded-full bg-emerald-500/15 px-3 py-1 text-sm text-emerald-300">
                <span class="mr-2 h-2 w-2 animate-pulse rounded-full bg-emerald-400"></span>
                Шууд үр дүн
              </div>
            </div>
          </section>

          <div id="dynamicResults" class="space-y-8"></div>

          <div class="mt-10 text-center">
            <button
              onclick="goBackToVoting()"
              class="inline-flex items-center rounded-xl border-2 border-white/20 bg-white/10 px-8 py-3 font-medium transition hover:border-violet-500 hover:bg-violet-500/20"
            >
              ← Санал хураалт руу буцах
            </button>
          </div>
        </div>
      </div>
    </main>

    <script>
      const API_URL = "https://clapcomedyclub.mn/artist/api";
      const IG_GRADIENT = "bg-[linear-gradient(135deg,#405de6_0%,#833ab4_25%,#c13584_50%,#e1306c_75%,#fd1d1d_100%)]";

      let votingSessionId = "", companyId = "", updateInterval;

      const $ = (id) => document.getElementById(id);
      const getQueryParam = (p) => new URLSearchParams(window.location.search).get(p);

      function goBackToVoting() {
        if (companyId) window.location.href = `index.html?companyId=${companyId}`;
        else window.history.back();
      }

      function escapeHtml(str) {
        if (str == null) return "";
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
      }

      async function fetchInstagramProfile(username) {
        const cacheKey = `ig_profile_${username}`;
        try {
          const cached = sessionStorage.getItem(cacheKey);
          if (cached) {
            const data = JSON.parse(cached);
            if (data.expires > Date.now()) return data.profile;
          }
        } catch {}

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 12000);
          const res = await fetch(`${API_URL}/instagram/${encodeURIComponent(username)}`, { signal: controller.signal });
          clearTimeout(timeoutId);
          const profile = res.ok ? await res.json() : null;
          try {
            sessionStorage.setItem(cacheKey, JSON.stringify({
              profile,
              expires: Date.now() + (profile ? 30 * 60 * 1000 : 5 * 60 * 1000),
            }));
          } catch {}
          return profile;
        } catch {
          return null;
        }
      }

      function lazyLoadInstagramProfiles() {
        document.querySelectorAll("[data-ig-username]:not([data-ig-loaded])").forEach(async (card) => {
          card.dataset.igLoaded = "1";
          const username = card.dataset.igUsername;
          if (!username) return;
          const profile = await fetchInstagramProfile(username);
          if (!profile) {
            card.querySelector("[data-ig-posts]")?.remove();
            return;
          }
          const avatarImg = card.querySelector("[data-ig-avatar]");
          if (profile.profilePic && avatarImg) {
            avatarImg.src = profile.profilePic;
            avatarImg.classList.remove("hidden");
          }
          const nameEl = card.querySelector("[data-ig-fullname]");
          if (profile.fullName && nameEl) {
            nameEl.textContent = profile.fullName;
            nameEl.classList.remove("hidden");
          }
          const slot = card.querySelector("[data-ig-posts]");
          if (slot) {
            if (profile.posts && profile.posts.length) {
              slot.innerHTML = profile.posts.slice(0, 3).map((p) => `
                <a href="${escapeHtml(p.postUrl)}" target="_blank" rel="noopener noreferrer" class="block aspect-square overflow-hidden rounded-lg bg-black/30 transition hover:scale-105">
                  <img src="${escapeHtml(p.image)}" alt="" loading="lazy" class="h-full w-full object-cover" onerror="this.parentElement.style.display='none'" />
                </a>`).join("");
            } else {
              slot.remove();
            }
          }
        });
      }

      function parseInstagramUrl(url) {
        if (!url) return null;
        try {
          const u = new URL(url);
          if (!u.hostname.includes("instagram.com")) return null;
          const parts = u.pathname.split("/").filter(Boolean);
          if (parts.length === 0) return null;
          if (["p", "reel", "tv"].includes(parts[0]) && parts[1]) {
            return { type: "post", embedUrl: `https://www.instagram.com/${parts[0]}/${parts[1]}/embed`, profileUrl: url };
          }
          return { type: "profile", username: parts[0], profileUrl: url };
        } catch { return null; }
      }

      async function loadResults() {
        votingSessionId = getQueryParam("sessionId");
        companyId = getQueryParam("companyId");

        if (!votingSessionId) {
          $("loading").classList.add("hidden");
          $("content").classList.remove("hidden");
          $("noResults").classList.remove("hidden");
          $("noResults").innerHTML = `
            <h2 class="mb-4 text-3xl font-bold text-violet-400">Буруу холбоос</h2>
            <p class="text-lg text-slate-400">Холбоос дотор Session ID байхгүй байна.</p>`;
          return;
        }

        try {
          const endpoint = companyId
            ? `${API_URL}/results/${votingSessionId}/company/${companyId}`
            : `${API_URL}/results/${votingSessionId}`;
          const res = await fetch(endpoint);
          const data = await res.json();

          $("loading").classList.add("hidden");
          $("content").classList.remove("hidden");

          if (!data.results) { $("noResults").classList.remove("hidden"); return; }

          $("eventTitle").textContent = data.title;
          $("totalVotes").textContent = data.totalVotes;

          const badge = $("viewModeBadge");
          if (data.company) {
            $("companyName").textContent = data.company;
            $("companyNameContainer").classList.remove("hidden");
            badge.textContent = "📍 Компанийн харагдац";
            badge.className = "inline-flex items-center rounded-full border-2 border-fuchsia-400 bg-fuchsia-500/20 px-4 py-1.5 text-sm font-bold text-fuchsia-300";
          } else {
            badge.textContent = "🌍 Нийт харагдац";
            badge.className = "inline-flex items-center rounded-full border-2 border-sky-400 bg-sky-500/20 px-4 py-1.5 text-sm font-bold text-sky-300";
          }
          $("viewModeContainer").classList.remove("hidden");

          renderDynamicResults(data.results, data.totalVotes);
          $("resultsActive").classList.remove("hidden");
        } catch (err) {
          console.error("Error loading results:", err);
          $("loading").classList.add("hidden");
          $("content").classList.remove("hidden");
          $("noResults").classList.remove("hidden");
        }
      }

      function renderDynamicResults(results, totalVotes) {
        const container = $("dynamicResults");
        container.innerHTML = "";
        const entries = Object.entries(results);
        if (entries.length === 0) {
          container.innerHTML = `<p class="text-center text-slate-400">Энэ хэсэгт санал хураалт байхгүй.</p>`;
          return;
        }
        for (const [, sectionData] of entries) {
          if (sectionData.type === "text-input") container.appendChild(buildTextResponsesSection(sectionData));
          else container.appendChild(buildOptionResultsSection(sectionData, totalVotes));
        }
        lazyLoadInstagramProfiles();
      }

      const RANK_STYLES = {
        1: "bg-gradient-to-br from-yellow-300 to-yellow-500 text-black shadow-lg shadow-yellow-400/50",
        2: "bg-gradient-to-br from-slate-300 to-slate-400 text-black shadow-lg shadow-slate-300/50",
        3: "bg-gradient-to-br from-amber-600 to-amber-700 text-white shadow-lg shadow-amber-600/50",
      };

      function buildOptionResultsSection(sectionData, totalVotes) {
        const section = document.createElement("section");
        section.className = "rounded-2xl border border-white/10 bg-white/5 p-6 backdrop-blur-sm sm:p-8";
        section.innerHTML = `<h3 class="mb-6 text-xl font-bold text-violet-400 sm:text-2xl">${escapeHtml(sectionData.label || "")}</h3>`;

        if (!sectionData.options || sectionData.options.length === 0) {
          section.innerHTML += `<p class="text-slate-400">Энэ хэсэгт сонголт байхгүй.</p>`;
          return section;
        }

        const grid = document.createElement("div");
        grid.className = "grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3";

        const sectionTotal = sectionData.options.reduce((s, o) => s + (o.votes || 0), 0);
        const denom = sectionTotal > 0 ? sectionTotal : 1;

        sectionData.options.forEach((result, index) => {
          const percentage = sectionTotal > 0 ? ((result.votes / denom) * 100).toFixed(1) : "0.0";
          const rank = index + 1;
          const rankClass = RANK_STYLES[rank] || "bg-violet-500 text-white";

          const instaInfo = result.instagramUrl ? parseInstagramUrl(result.instagramUrl) : null;
          let mediaBlock;

          if (result.imageUrl) {
            mediaBlock = `
              <div class="relative aspect-square w-full overflow-hidden bg-white/5">
                <div class="absolute left-3 top-3 z-10 flex h-10 w-10 items-center justify-center rounded-full font-bold ${rankClass}">#${rank}</div>
                <img src="${escapeHtml(result.imageUrl)}" alt="${escapeHtml(result.name)}" class="h-full w-full object-cover"
                     onerror="this.onerror=null;this.src='https://via.placeholder.com/400x400?text=${encodeURIComponent(result.name)}'" />
              </div>`;
          } else if (instaInfo && instaInfo.type === "post") {
            mediaBlock = `
              <div class="relative aspect-square w-full overflow-hidden bg-white">
                <div class="absolute left-3 top-3 z-10 flex h-10 w-10 items-center justify-center rounded-full font-bold ${rankClass}">#${rank}</div>
                <iframe src="${escapeHtml(instaInfo.embedUrl)}" loading="lazy" scrolling="no" allowtransparency="true" allow="encrypted-media" class="h-full w-full border-0"></iframe>
              </div>`;
          } else if (instaInfo && instaInfo.type === "profile") {
            const username = instaInfo.username;
            mediaBlock = `
              <div data-ig-username="${escapeHtml(username)}" class="relative ${IG_GRADIENT} flex flex-col items-center gap-3 p-5 text-white">
                <div class="absolute left-3 top-3 z-10 flex h-10 w-10 items-center justify-center rounded-full font-bold ${rankClass}">#${rank}</div>
                <div class="relative mt-2 flex h-24 w-24 items-center justify-center overflow-hidden rounded-full border-[3px] border-white bg-white/30 text-4xl shadow-xl">
                  <span>📸</span>
                  <img data-ig-avatar alt="" loading="lazy" class="absolute inset-0 hidden h-full w-full object-cover" onerror="this.classList.add('hidden')" />
                </div>
                <div class="min-w-0 text-center">
                  <div class="break-words font-bold">@${escapeHtml(username)}</div>
                  <div data-ig-fullname class="hidden break-words text-xs opacity-90"></div>
                  <div class="mt-0.5 text-xs opacity-70">Instagram</div>
                </div>
                <div data-ig-posts class="grid w-full grid-cols-3 gap-1">
                  <div class="aspect-square animate-pulse rounded-lg bg-black/30"></div>
                  <div class="aspect-square animate-pulse rounded-lg bg-black/30"></div>
                  <div class="aspect-square animate-pulse rounded-lg bg-black/30"></div>
                </div>
              </div>`;
          } else {
            mediaBlock = `
              <div class="relative aspect-square w-full overflow-hidden bg-white/5">
                <div class="absolute left-3 top-3 z-10 flex h-10 w-10 items-center justify-center rounded-full font-bold ${rankClass}">#${rank}</div>
                <img src="https://via.placeholder.com/400x400?text=${encodeURIComponent(result.name)}" alt="${escapeHtml(result.name)}" class="h-full w-full object-cover" />
              </div>`;
          }

          const igFooter = instaInfo && instaInfo.type === "profile"
            ? `<a href="${escapeHtml(instaInfo.profileUrl)}" target="_blank" rel="noopener noreferrer" class="mt-3 inline-block text-sm text-fuchsia-400 transition hover:text-fuchsia-300">Instagram дээр үзэх ↗</a>`
            : "";

          const card = document.createElement("article");
          card.className = "overflow-hidden rounded-2xl border-2 border-white/10 bg-white/5 transition hover:-translate-y-1 hover:border-violet-400/60 hover:shadow-xl hover:shadow-violet-500/20";
          card.innerHTML = `
            ${mediaBlock}
            <div class="p-5">
              <h4 class="mb-3 text-lg font-semibold text-slate-100">${escapeHtml(result.name)}</h4>
              <div class="mb-3 flex items-center justify-between">
                <div class="text-xl font-bold text-violet-400">${result.votes} санал</div>
                <div class="text-slate-400">${percentage}%</div>
              </div>
              <div class="h-3 w-full overflow-hidden rounded-full bg-white/10">
                <div class="h-full rounded-full bg-gradient-to-r from-violet-500 to-fuchsia-500 transition-all duration-500" style="width: ${percentage}%"></div>
              </div>
              ${igFooter}
            </div>`;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        return section;
      }

      function buildTextResponsesSection(sectionData) {
        const section = document.createElement("section");
        section.className = "rounded-2xl border border-white/10 bg-white/5 p-6 backdrop-blur-sm sm:p-8";
        section.innerHTML = `<h3 class="mb-6 text-xl font-bold text-violet-400 sm:text-2xl">💡 ${escapeHtml(sectionData.label || "Хариултууд")}</h3>`;

        if (!sectionData.responses || sectionData.responses.length === 0) {
          section.innerHTML += `<p class="text-slate-400">Хариулт одоогоор байхгүй.</p>`;
          return section;
        }

        const list = document.createElement("div");
        list.className = "space-y-4";
        sectionData.responses.forEach((req) => {
          const timestamp = new Date(req.timestamp).toLocaleString();
          const item = document.createElement("div");
          item.className = "rounded-xl border-l-4 border-violet-500 bg-white/5 p-5";
          item.innerHTML = `
            <div class="mb-2 text-base italic text-slate-100">"${escapeHtml(req.response)}"</div>
            <div class="text-sm text-slate-500">Илгээсэн: ${escapeHtml(timestamp)}</div>`;
          list.appendChild(item);
        });
        section.appendChild(list);
        return section;
      }

      loadResults();
      updateInterval = setInterval(loadResults, 5000);

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) clearInterval(updateInterval);
        else { loadResults(); updateInterval = setInterval(loadResults, 5000); }
      });
    </script>
  </body>
</html>
