<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voting Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
    </script>
    <link href="https://rsms.me/inter/inter.css" rel="stylesheet" />
    <style type="text/tailwindcss">
      @layer components {
        .result-card {
          @apply rounded-2xl bg-white/5 border-2 border-transparent overflow-hidden transition-all duration-300;
        }
        .result-card:hover {
          @apply -translate-y-1 border-violet-500 shadow-xl shadow-violet-500/20;
        }
        .ig-gradient {
          background: linear-gradient(135deg, #405de6 0%, #833ab4 25%, #c13584 50%, #e1306c 75%, #fd1d1d 100%);
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 font-sans relative overflow-x-hidden">
    <div class="pointer-events-none fixed inset-0 -z-10">
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[500px] rounded-full bg-violet-600/15 blur-[140px]"></div>
      <div class="absolute bottom-0 right-0 w-[500px] h-[500px] rounded-full bg-fuchsia-600/10 blur-[120px]"></div>
    </div>

    <div class="max-w-6xl mx-auto px-4 py-10 md:py-16">
      <header class="text-center mb-10">
        <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent mb-3">
          🎉 VOTING RESULTS
        </h1>
        <p class="text-slate-400 text-lg">Live event planning results</p>
      </header>

      <div id="loading" class="text-center py-20">
        <div class="inline-block w-12 h-12 border-4 border-white/10 border-l-violet-500 rounded-full animate-spin"></div>
        <p class="mt-5 text-lg text-slate-400">Loading results...</p>
      </div>

      <div id="content" class="hidden">
        <div id="noResults" class="hidden text-center py-20">
          <h2 class="text-3xl font-bold text-violet-400 mb-4">No Results Available</h2>
          <p class="text-slate-400 text-lg">There are no voting results yet for this session.</p>
        </div>

        <div id="resultsActive" class="hidden">
          <div class="rounded-2xl bg-white/5 border-l-4 border-violet-500 p-6 mb-8 backdrop-blur-sm">
            <h2 id="eventTitle" class="text-2xl font-bold text-violet-400 mb-3"></h2>
            <div class="flex flex-wrap gap-4 items-center text-slate-400">
              <div id="companyNameContainer" class="hidden">🏢 <span id="companyName"></span></div>
              <div id="viewModeContainer" class="hidden">
                <span id="viewModeBadge" class="inline-flex items-center px-4 py-1.5 rounded-full text-sm font-bold border-2"></span>
              </div>
              <div>📊 <span id="totalVotes">0</span> total votes</div>
              <div class="inline-flex items-center px-3 py-1 rounded-full bg-emerald-500/15 text-emerald-300 text-sm">
                <span class="w-2 h-2 bg-emerald-400 rounded-full mr-2 animate-pulse"></span>
                Live Results
              </div>
            </div>
          </div>

          <div id="dynamicResults" class="space-y-8"></div>

          <div class="text-center mt-10">
            <button onclick="goBackToVoting()" class="inline-block px-8 py-3 rounded-xl bg-white/10 hover:bg-violet-500/20 border-2 border-white/20 hover:border-violet-500 transition">
              ← Back to Voting
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "https://clapcomedyclub.mn/artist/api";
      let votingSessionId = "", companyId = "", updateInterval;

      const $ = (id) => document.getElementById(id);
      const getQueryParam = (p) => new URLSearchParams(window.location.search).get(p);

      function goBackToVoting() {
        if (companyId) window.location.href = `index.html?companyId=${companyId}`;
        else window.history.back();
      }

      function escapeHtml(str) {
        if (str == null) return "";
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
      }

      async function fetchInstagramProfile(username) {
        const cacheKey = `ig_profile_${username}`;
        try {
          const cached = sessionStorage.getItem(cacheKey);
          if (cached) {
            const data = JSON.parse(cached);
            if (data.expires > Date.now()) return data.profile;
          }
        } catch {}

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000);
          const res = await fetch(`${API_URL}/instagram/${encodeURIComponent(username)}`, { signal: controller.signal });
          clearTimeout(timeoutId);
          const profile = res.ok ? await res.json() : null;
          try {
            sessionStorage.setItem(cacheKey, JSON.stringify({
              profile,
              expires: Date.now() + (profile ? 30 * 60 * 1000 : 5 * 60 * 1000),
            }));
          } catch {}
          return profile;
        } catch {
          return null;
        }
      }

      function lazyLoadInstagramProfiles() {
        document.querySelectorAll(".ig-profile-card:not([data-loaded])").forEach(async (card) => {
          card.dataset.loaded = "1";
          const username = card.dataset.username;
          if (!username) return;
          const profile = await fetchInstagramProfile(username);
          if (!profile) {
            card.querySelector(".ig-posts-slot")?.remove();
            return;
          }
          const avatarImg = card.querySelector(".ig-avatar-img");
          if (profile.profilePic && avatarImg) {
            avatarImg.src = profile.profilePic;
            avatarImg.style.display = "";
          }
          if (profile.fullName) {
            const nameEl = card.querySelector(".ig-fullname");
            if (nameEl) { nameEl.textContent = profile.fullName; nameEl.classList.remove("hidden"); }
          }
          const slot = card.querySelector(".ig-posts-slot");
          if (slot) {
            if (profile.posts && profile.posts.length) {
              slot.innerHTML = profile.posts.slice(0, 3).map((p) => `
                <a href="${escapeHtml(p.postUrl)}" target="_blank" rel="noopener noreferrer" class="block aspect-square overflow-hidden rounded bg-black/20">
                  <img src="${escapeHtml(p.image)}" alt="" loading="lazy" class="w-full h-full object-cover" onerror="this.parentElement.style.display='none'">
                </a>`).join("");
            } else {
              slot.remove();
            }
          }
        });
      }

      function parseInstagramUrl(url) {
        if (!url) return null;
        try {
          const u = new URL(url);
          if (!u.hostname.includes("instagram.com")) return null;
          const parts = u.pathname.split("/").filter(Boolean);
          if (parts.length === 0) return null;
          if (["p", "reel", "tv"].includes(parts[0]) && parts[1]) {
            return { type: "post", embedUrl: `https://www.instagram.com/${parts[0]}/${parts[1]}/embed`, profileUrl: url };
          }
          return { type: "profile", username: parts[0], profileUrl: url };
        } catch { return null; }
      }

      async function loadResults() {
        votingSessionId = getQueryParam("sessionId");
        companyId = getQueryParam("companyId");

        if (!votingSessionId) {
          $("loading").classList.add("hidden");
          $("content").classList.remove("hidden");
          $("noResults").classList.remove("hidden");
          $("noResults").innerHTML = `
            <h2 class="text-3xl font-bold text-violet-400 mb-4">Invalid URL</h2>
            <p class="text-slate-400 text-lg">Session ID is missing from the URL.</p>`;
          return;
        }

        try {
          const endpoint = companyId
            ? `${API_URL}/results/${votingSessionId}/company/${companyId}`
            : `${API_URL}/results/${votingSessionId}`;
          const res = await fetch(endpoint);
          const data = await res.json();

          $("loading").classList.add("hidden");
          $("content").classList.remove("hidden");

          if (!data.results) { $("noResults").classList.remove("hidden"); return; }

          $("eventTitle").textContent = data.title;
          $("totalVotes").textContent = data.totalVotes;

          const badge = $("viewModeBadge");
          if (data.company) {
            $("companyName").textContent = data.company;
            $("companyNameContainer").classList.remove("hidden");
            badge.textContent = "📍 Company View";
            badge.className = "inline-flex items-center px-4 py-1.5 rounded-full text-sm font-bold border-2 bg-fuchsia-500/20 border-fuchsia-400 text-fuchsia-300";
          } else {
            badge.textContent = "🌍 Global View";
            badge.className = "inline-flex items-center px-4 py-1.5 rounded-full text-sm font-bold border-2 bg-sky-500/20 border-sky-400 text-sky-300";
          }
          $("viewModeContainer").classList.remove("hidden");

          renderDynamicResults(data.results, data.totalVotes);
          $("resultsActive").classList.remove("hidden");
        } catch (err) {
          console.error("Error loading results:", err);
          $("loading").classList.add("hidden");
          $("content").classList.remove("hidden");
          $("noResults").classList.remove("hidden");
        }
      }

      function renderDynamicResults(results, totalVotes) {
        const container = $("dynamicResults");
        container.innerHTML = "";
        const entries = Object.entries(results);
        if (entries.length === 0) {
          container.innerHTML = `<p class="text-center text-slate-400">No sections in this session.</p>`;
          return;
        }
        for (const [, sectionData] of entries) {
          if (sectionData.type === "text-input") container.appendChild(buildTextResponsesSection(sectionData));
          else container.appendChild(buildOptionResultsSection(sectionData, totalVotes));
        }
        lazyLoadInstagramProfiles();
      }

      function buildOptionResultsSection(sectionData, totalVotes) {
        const section = document.createElement("div");
        section.className = "rounded-2xl bg-white/5 border border-white/10 backdrop-blur-sm p-6 md:p-8";
        section.innerHTML = `<h3 class="text-2xl font-bold text-violet-400 mb-6">${escapeHtml(sectionData.label || "")}</h3>`;

        if (!sectionData.options || sectionData.options.length === 0) {
          section.innerHTML += `<p class="text-slate-400">No options in this section.</p>`;
          return section;
        }

        const grid = document.createElement("div");
        grid.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5";

        const sectionTotal = sectionData.options.reduce((s, o) => s + (o.votes || 0), 0);
        const denom = sectionTotal > 0 ? sectionTotal : 1;

        const rankStyles = {
          1: "bg-gradient-to-br from-yellow-300 to-yellow-500 text-black shadow-lg shadow-yellow-400/50",
          2: "bg-gradient-to-br from-slate-300 to-slate-400 text-black shadow-lg shadow-slate-300/50",
          3: "bg-gradient-to-br from-amber-600 to-amber-700 text-white shadow-lg shadow-amber-600/50",
        };

        sectionData.options.forEach((result, index) => {
          const percentage = sectionTotal > 0 ? ((result.votes / denom) * 100).toFixed(1) : "0.0";
          const rank = index + 1;
          const rankClass = rankStyles[rank] || "bg-violet-500 text-white";

          const instaInfo = result.instagramUrl ? parseInstagramUrl(result.instagramUrl) : null;
          let footerHtml = "";

          let mediaBlock;
          if (result.imageUrl) {
            mediaBlock = `
              <div class="relative w-full aspect-square overflow-hidden bg-white/5 text-white">
                <div class="absolute top-3 left-3 z-10 w-10 h-10 rounded-full flex items-center justify-center font-bold ${rankClass}">#${rank}</div>
                <img src="${escapeHtml(result.imageUrl)}" alt="${escapeHtml(result.name)}" class="w-full h-full object-cover"
                     onerror="this.onerror=null;this.src='https://via.placeholder.com/400x400?text=${encodeURIComponent(result.name)}'">
              </div>`;
          } else if (instaInfo && instaInfo.type === "post") {
            mediaBlock = `
              <div class="relative w-full aspect-square overflow-hidden bg-white text-white">
                <div class="absolute top-3 left-3 z-10 w-10 h-10 rounded-full flex items-center justify-center font-bold ${rankClass}">#${rank}</div>
                <iframe src="${escapeHtml(instaInfo.embedUrl)}" loading="lazy" scrolling="no" allowtransparency="true" allow="encrypted-media" class="w-full h-full border-0"></iframe>
              </div>`;
          } else if (instaInfo && instaInfo.type === "profile") {
            const username = instaInfo.username;
            mediaBlock = `
              <div class="ig-profile-card relative w-full ig-gradient text-white p-5 flex flex-col items-center gap-3" data-username="${escapeHtml(username)}">
                <div class="absolute top-3 left-3 z-10 w-10 h-10 rounded-full flex items-center justify-center font-bold ${rankClass}">#${rank}</div>
                <div class="relative w-24 h-24 rounded-full border-[3px] border-white bg-white/30 overflow-hidden shadow-xl flex items-center justify-center text-4xl mt-2">
                  <span>📸</span>
                  <img class="ig-avatar-img absolute inset-0 w-full h-full object-cover" alt="" loading="lazy" style="display:none" onerror="this.style.display='none'">
                </div>
                <div class="text-center min-w-0 w-full">
                  <div class="font-bold break-words">@${escapeHtml(username)}</div>
                  <div class="ig-fullname hidden text-xs opacity-90 break-words"></div>
                  <div class="text-xs opacity-70 mt-0.5">on Instagram</div>
                </div>
                <div class="grid grid-cols-3 gap-1 w-full ig-posts-slot">
                  <div class="aspect-square rounded bg-black/20 animate-pulse"></div>
                  <div class="aspect-square rounded bg-black/20 animate-pulse"></div>
                  <div class="aspect-square rounded bg-black/20 animate-pulse"></div>
                </div>
              </div>`;
            footerHtml = `<a class="block mt-3 text-sm text-fuchsia-400 hover:text-fuchsia-300 transition" href="${escapeHtml(instaInfo.profileUrl)}" target="_blank" rel="noopener noreferrer">View on Instagram ↗</a>`;
          } else {
            mediaBlock = `
              <div class="relative w-full aspect-square overflow-hidden bg-white/5 text-white">
                <div class="absolute top-3 left-3 z-10 w-10 h-10 rounded-full flex items-center justify-center font-bold ${rankClass}">#${rank}</div>
                <img src="https://via.placeholder.com/400x400?text=${encodeURIComponent(result.name)}" alt="${escapeHtml(result.name)}" class="w-full h-full object-cover">
              </div>`;
          }

          const card = document.createElement("div");
          card.className = "result-card";
          card.innerHTML = `
            ${mediaBlock}
            <div class="p-5">
              <div class="text-lg font-semibold mb-3">${escapeHtml(result.name)}</div>
              <div class="flex justify-between items-center mb-3">
                <div class="text-xl font-bold text-violet-400">${result.votes} votes</div>
                <div class="text-slate-400">${percentage}%</div>
              </div>
              <div class="w-full h-3 bg-white/10 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-violet-500 to-fuchsia-500 rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
              </div>
              ${footerHtml}
            </div>`;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        return section;
      }

      function buildTextResponsesSection(sectionData) {
        const section = document.createElement("div");
        section.className = "rounded-2xl bg-white/5 border border-white/10 backdrop-blur-sm p-6 md:p-8";
        section.innerHTML = `<h3 class="text-2xl font-bold text-violet-400 mb-6">💡 ${escapeHtml(sectionData.label || "Responses")}</h3>`;

        if (!sectionData.responses || sectionData.responses.length === 0) {
          section.innerHTML += `<p class="text-slate-400">No responses yet.</p>`;
          return section;
        }

        const list = document.createElement("div");
        list.className = "space-y-4";
        sectionData.responses.forEach((req) => {
          const timestamp = new Date(req.timestamp).toLocaleString();
          const item = document.createElement("div");
          item.className = "rounded-xl bg-white/5 border-l-4 border-violet-500 p-5";
          item.innerHTML = `
            <div class="text-base mb-2">"${escapeHtml(req.response)}"</div>
            <div class="text-sm text-slate-500">Submitted: ${escapeHtml(timestamp)}</div>`;
          list.appendChild(item);
        });
        section.appendChild(list);
        return section;
      }

      loadResults();
      updateInterval = setInterval(loadResults, 5000);

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) clearInterval(updateInterval);
        else { loadResults(); updateInterval = setInterval(loadResults, 5000); }
      });
    </script>
  </body>
</html>
